<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rathnaveri Kavitha Official Fan Page & Youth Association - Community Wall, Digital Member ID Pass, Events & Cultural Heritage.">
  <meta name="keywords" content="Rathnaveri Kavitha, Fan Page, Youth Association, Community, Events, Telangana, Cultural Heritage">
  <meta name="author" content="Rathnaveri Kavitha Fan Association">

  <!-- Open Graph -->
  <meta property="og:title" content="Rathnaveri Kavitha Official Fan Page">
  <meta property="og:description" content="Official community hub, digital fan ID cards, events & rallies for Rathnaveri Kavitha.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RK Fans">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rathnaveri Kavitha Official Fan Page</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0B0F19 0%, #2E0914 50%, #0B0F19 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .loading-wrap {
      text-align: center;
      user-select: none;
    }

    .logo-crest {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, #EF233C, #8D0801);
      border: 3px solid #FFB703;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 900;
      color: #FFB703;
      box-shadow: 0 0 30px rgba(255, 183, 3, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    .title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #FFB703;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      margin: 0 auto;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #D90429, #FFB703);
      border-radius: 3px;
      animation: slide 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 183, 3, 0.35); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 183, 3, 0.6); }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div class="loading-wrap">
    <div class="logo-crest">RK</div>
    <div class="title">RATHNAVERI KAVITHA</div>
    <div class="subtitle">OFFICIAL YOUTH FAN HUB</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
